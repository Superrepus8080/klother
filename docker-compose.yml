version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       klother
      POSTGRES_USER:     klother
      POSTGRES_PASSWORD: klother
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klother"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Rust measurement service ────────────────────────────────────────────────
  measurement-service:
    build:
      context: ./measurement-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      PORT:      "9090"
      MODEL_DIR: "/models"
      RUST_LOG:  "klother_measure=debug,tower_http=info"
    volumes:
      # Mount pre-downloaded ONNX models (not committed to git)
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vert.x JVM application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      measurement-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_PORT:                "8080"
      APP_DEV_MODE:            "false"
      APP_MEASURE_SERVICE_URL: "http://measurement-service:9090"
      APP_DB_HOST:             "postgres"
      APP_DB_PORT:             "5432"
      APP_DB_NAME:             "klother"
      APP_DB_USER:             "klother"
      APP_DB_PASSWORD:         "klother"

volumes:
  postgres_data:
